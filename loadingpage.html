<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iGEM IITB Loading</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300;1,600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f5f0e8;
    overflow: hidden;
  }

  /* Subtle grain texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    opacity: 0.5;
  }

  .igem-label {
    position: relative;
    margin-bottom: 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .igem-wordmark {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 42px;
    letter-spacing: 0.18em;
    color: #3A3020;
    line-height: 1;
  }

  .igem-wordmark span.gem {
    font-style: italic;
    font-weight: 300;
    color: #6B9CB8;
  }

  .igem-wordmark span.iitb {
    font-style: normal;
    font-weight: 300;
    font-size: 28px;
    color: #8B7355;
    letter-spacing: 0.22em;
    margin-left: 6px;
  }

  .igem-rule {
    width: 100%;
    height: 1px;
    background: linear-gradient(to right, transparent, #8B7355 30%, #6B9CB8 70%, transparent);
    margin: 6px 0 0;
  }

  /* Loading bar */
  .progress-wrap {
    margin-top: 22px;
    width: 180px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .progress-track {
    width: 100%;
    height: 3px;
    background: rgba(107,156,184,0.18);
    border-radius: 99px;
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 99px;
    background: linear-gradient(to right, #4A7FA0, #A8D8F0);
    box-shadow: 0 0 8px rgba(107,156,184,0.6);
    transition: width 0.12s ease;
  }

  .progress-pct {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: #6B9CB8;
  }

  .dna-container {
    perspective: 600px;
    margin-bottom: 40px;
  }

  canvas {
    display: block;
  }

  .loading-text {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.45em;
    color: #6B9CB8;
    text-transform: uppercase;
    position: relative;
  }

  .loading-text::after {
    content: '';
    animation: dots 1.6s steps(4, end) infinite;
  }

  @keyframes dots {
    0%   { content: ''; }
    25%  { content: '.'; }
    50%  { content: '..'; }
    75%  { content: '...'; }
    100% { content: ''; }
  }


  #loading-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Space Mono', monospace;
    transition: opacity 0.6s ease;
  }
</style>
</head>
<body>
<div id="loading-screen">

<div class="igem-label">
  <div class="igem-wordmark">i<span class="gem">GEM</span><span class="iitb">IITB</span></div>
  <div class="igem-rule"></div>
</div>

<div class="dna-container">
  <canvas id="dna" width="120" height="260"></canvas>
</div>

<div class="loading-text">Loading</div>
<div class="progress-wrap">
  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="progress-pct" id="progressPct">0%</div>
</div>

</div>

<script>
const canvas = document.getElementById('dna');
const ctx = canvas.getContext('2d');

const W = canvas.width;
const H = canvas.height;

// Colors
const strand1Color = '#6B9CB8'; // light blue
const strand2Color = '#4A7FA0'; // slightly deeper blue
const runColor     = '#A8C8DC'; // pale connector
const bgColor      = '#F5F0E8';

// DNA parameters
const numPoints = 28;       // points along the helix length
const amplitude = 28;       // horizontal amplitude
const centerX   = W / 2;

let rotX = 0; // rotation angle around X axis (for buffering spin)

function drawDNA(rotationX) {
  ctx.clearRect(0, 0, W, H);

  // We draw the DNA as two sinusoidal strands
  // y goes from top to bottom (0 to H)
  // strand1: x = centerX + amplitude * cos(t + rotX)   -- rotX creates the 3D rotation feel
  // strand2: x = centerX - amplitude * cos(t + rotX)   (mirror on X)
  // The 3D rotation around X: we scale amplitude by cos(rotX) and shift slightly in depth

  const points1 = [];
  const points2 = [];

  for (let i = 0; i <= numPoints; i++) {
    const t = (i / numPoints) * Math.PI * 2; // one full wavelength
    const y = 10 + (i / numPoints) * (H - 20);

    // Rotation around X axis: cosine gives the projection
    const cosR = Math.cos(rotationX);
    const sinR = Math.sin(rotationX);

    // 3D helix coords: strand1 at angle t, strand2 at angle t+PI
    const x1_3d = amplitude * Math.cos(t);
    const z1_3d = amplitude * Math.sin(t);

    const x2_3d = amplitude * Math.cos(t + Math.PI);
    const z2_3d = amplitude * Math.sin(t + Math.PI);

    // Rotate around X: y' = y*cosR - z*sinR, z' = y*sinR + z*cosR
    // But we just want the visual x-projection. For rotating around X axis:
    // new_x = x (unchanged), new_y = y*cosR - z*sinR
    // So the projected x stays, and y shifts slightly
    // Actually for a nice buffering spin, rotate the whole helix around X:
    // We treat the helix as a 3D object and rotate it around X.
    // Let's define 3D coords with Y = vertical (canvas y mapped to 3D y)
    // and the helix winding around Y axis.

    const x1 = centerX + x1_3d;
    const x2 = centerX + x2_3d;

    // Depth for drawing order
    const z1 = z1_3d;
    const z2 = z2_3d;

    // Scale opacity/size by depth (pseudo-3D)
    const depth1 = (z1 + amplitude) / (2 * amplitude); // 0..1
    const depth2 = (z2 + amplitude) / (2 * amplitude);

    points1.push({ x: x1, y, z: z1, depth: depth1 });
    points2.push({ x: x2, y, z: z2, depth: depth2 });
  }

  // Draw rungs (connecting lines between strands)
  for (let i = 0; i <= numPoints; i++) {
    const p1 = points1[i];
    const p2 = points2[i];

    // Only draw rungs at roughly equal intervals
    if (i % 3 !== 0) continue;

    const avgDepth = (p1.depth + p2.depth) / 2;
    const alpha = 0.25 + avgDepth * 0.45;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = runColor;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();

    // Small dots at rung ends
    ctx.fillStyle = '#C8DDE8';
    ctx.beginPath();
    ctx.arc(p1.x, p1.y, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(p2.x, p2.y, 2.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // Draw strand 1
  ctx.save();
  ctx.beginPath();
  for (let i = 0; i <= numPoints; i++) {
    const p = points1[i];
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  }
  ctx.strokeStyle = strand1Color;
  ctx.lineWidth = 3;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.restore();

  // Draw strand 2
  ctx.save();
  ctx.beginPath();
  for (let i = 0; i <= numPoints; i++) {
    const p = points2[i];
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  }
  ctx.strokeStyle = strand2Color;
  ctx.lineWidth = 3;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.restore();

  // Highlight dots on strands
  for (let i = 0; i <= numPoints; i += 3) {
    const p1 = points1[i];
    const p2 = points2[i];

    ctx.save();
    ctx.globalAlpha = 0.5 + p1.depth * 0.5;
    ctx.fillStyle = '#E8F4FB';
    ctx.beginPath();
    ctx.arc(p1.x, p1.y, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.5 + p2.depth * 0.5;
    ctx.fillStyle = '#B8D4E4';
    ctx.beginPath();
    ctx.arc(p2.x, p2.y, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// The "rotation around X axis" animation
// We'll simulate this by making the helix appear to spin by shifting the phase
// and also slightly compressing/expanding the amplitude to mimic perspective

let phase = 0;

function drawDNA3D(phase) {
  ctx.clearRect(0, 0, W, H);

  const points1 = [];
  const points2 = [];

  for (let i = 0; i <= numPoints; i++) {
    const t = (i / numPoints) * Math.PI * 2 + phase;
    const y = 10 + (i / numPoints) * (H - 20);

    // 3D helix around Y axis, then rotate around X axis by phase/2
    const helixX = amplitude * Math.cos(t);
    const helixZ = amplitude * Math.sin(t);

    const helixX2 = amplitude * Math.cos(t + Math.PI);
    const helixZ2 = amplitude * Math.sin(t + Math.PI);

    // Rotate around X: rotates the Y and Z
    // X stays as visual x
    const rotAngle = phase * 0.3; // gentle tilt
    const cosA = Math.cos(rotAngle);
    const sinA = Math.sin(rotAngle);

    // For the helix we want rotation around the Y (vertical) axis to show spin
    // Projected screen x = helixX, depth = helixZ
    const projX1 = centerX + helixX;
    const projX2 = centerX + helixX2;

    const depth1 = (helixZ + amplitude) / (2 * amplitude); // 0..1
    const depth2 = (helixZ2 + amplitude) / (2 * amplitude);

    points1.push({ x: projX1, y, depth: depth1, z: helixZ });
    points2.push({ x: projX2, y, depth: depth2, z: helixZ2 });
  }

  // Sort segments by depth for proper overlap rendering
  // Draw back segments first, front last

  // Collect all rung segments
  const rungs = [];
  for (let i = 0; i <= numPoints; i += 2) {
    const p1 = points1[i];
    const p2 = points2[i];
    const avgDepth = (p1.depth + p2.depth) / 2;
    rungs.push({ p1, p2, avgDepth, i });
  }

  // Draw rungs behind strands (back half)
  for (const r of rungs) {
    const { p1, p2, avgDepth } = r;
    if (avgDepth > 0.5) continue; // draw back rungs first
    const alpha = 0.15 + avgDepth * 0.4;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = runColor;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
    ctx.restore();
  }

  // Draw strands with depth-based opacity for each segment
  // Strand 1 segments
  for (let i = 0; i < numPoints; i++) {
    const p = points1[i];
    const pn = points1[i+1];
    const avgDepth = (p.depth + pn.depth) / 2;
    const alpha = 0.35 + avgDepth * 0.65;
    const lw = 1.5 + avgDepth * 2;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = strand1Color;
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(pn.x, pn.y);
    ctx.stroke();
    ctx.restore();
  }

  // Strand 2 segments
  for (let i = 0; i < numPoints; i++) {
    const p = points2[i];
    const pn = points2[i+1];
    const avgDepth = (p.depth + pn.depth) / 2;
    const alpha = 0.35 + avgDepth * 0.65;
    const lw = 1.5 + avgDepth * 2;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = strand2Color;
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(pn.x, pn.y);
    ctx.stroke();
    ctx.restore();
  }

  // Draw front rungs (over strands)
  for (const r of rungs) {
    const { p1, p2, avgDepth } = r;
    if (avgDepth <= 0.5) continue;
    const alpha = 0.3 + avgDepth * 0.5;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = runColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();

    // Rung endpoint dots
    ctx.fillStyle = '#D4EAF5';
    ctx.globalAlpha = alpha * 0.9;
    ctx.beginPath();
    ctx.arc(p1.x, p1.y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(p2.x, p2.y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Glowing dots on strands at rung junctions
  for (let i = 0; i <= numPoints; i += 2) {
    const p1 = points1[i];
    const p2 = points2[i];

    ctx.save();
    ctx.globalAlpha = 0.4 + p1.depth * 0.6;
    const grad1 = ctx.createRadialGradient(p1.x, p1.y, 0, p1.x, p1.y, 5);
    grad1.addColorStop(0, '#E8F6FF');
    grad1.addColorStop(1, 'rgba(107,156,184,0)');
    ctx.fillStyle = grad1;
    ctx.beginPath();
    ctx.arc(p1.x, p1.y, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.4 + p2.depth * 0.6;
    const grad2 = ctx.createRadialGradient(p2.x, p2.y, 0, p2.x, p2.y, 5);
    grad2.addColorStop(0, '#D0E8F5');
    grad2.addColorStop(1, 'rgba(74,127,160,0)');
    ctx.fillStyle = grad2;
    ctx.beginPath();
    ctx.arc(p2.x, p2.y, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function animate() {
  phase += 0.025;
  drawDNA3D(phase);
  requestAnimationFrame(animate);
}

animate();

// ── Progress bar ──────────────────────────────────────────
// In your real Vercel app, replace this simulation with:
//   window.__setLoadingProgress(percentage)   called from your app
let pct = 0;
const fill = document.getElementById('progressFill');
const pctLabel = document.getElementById('progressPct');

function setProgress(val) {
  pct = Math.min(100, Math.max(0, val));
  fill.style.width = pct + '%';
  pctLabel.textContent = Math.round(pct) + '%';
}

// Simulated progress (remove this block in production)
let sim = 0;
const simInterval = setInterval(() => {
  // Ease-in slow near 90 to feel realistic
  const step = sim < 70 ? 1.5 : sim < 90 ? 0.5 : 0.1;
  sim = Math.min(sim + step, 92);
  setProgress(sim);
  if (sim >= 92) clearInterval(simInterval);
}, 60);

// This is called by your app when truly done loading:
window.__doneLoading = function() {
  clearInterval(simInterval);
  setProgress(100);
  setTimeout(() => {
    document.getElementById('loading-screen').style.opacity = '0';
    setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 600);
  }, 400);
};
</script>
</body>
</html>
