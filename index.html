<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iGEM IIT Bombay</title>
    <meta
      name="description"
      content="iGEM IIT Bombay — a student-led synthetic biology team representing IIT Bombay at the annual iGEM competition."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      .app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: linear-gradient(
            120deg,
            rgba(255, 255, 255, 0.85),
            rgba(240, 248, 255, 0.75)
          ),
          rgba(235, 244, 248, 0.7);
        backdrop-filter: blur(10px);
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      .app-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
      }
      .app-loader__card {
        display: grid;
        place-items: center;
        gap: 10px;
        width: 260px;
        height: 260px;
        padding: 22px;
        border-radius: 50%;
        border: 1px solid rgba(31, 122, 140, 0.2);
        background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.95), rgba(235, 244, 248, 0.75));
        box-shadow: 0 22px 60px rgba(26, 36, 52, 0.18);
        text-align: center;
      }
      .app-loader__pulse {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-family: "Manrope", sans-serif;
        font-size: 12px;
        letter-spacing: 0.38em;
        text-transform: uppercase;
        color: #1f7a8c;
      }
      .app-loader__dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #1f7a8c;
        display: inline-block;
        animation: loader-bounce 1.2s infinite ease-in-out;
      }
      .app-loader__dots span:nth-child(2) {
        animation-delay: 0.2s;
        background: #5bc0d9;
      }
      .app-loader__dots span:nth-child(3) {
        animation-delay: 0.4s;
        background: #e2a053;
      }
      .app-loader__title {
        font-family: "Cormorant Garamond", serif;
        font-size: 22px;
        margin: 0;
        color: #1f2533;
        max-width: 200px;
      }
      .app-loader__subtitle {
        margin: 0;
        font-family: "Manrope", sans-serif;
        font-size: 14px;
        color: #5f6a7a;
        max-width: 200px;
      }
      @keyframes loader-bounce {
        0%,
        80%,
        100% {
          transform: translateY(0);
          opacity: 0.6;
        }
        40% {
          transform: translateY(-6px);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body class="text-ink font-body">
    <div class="app-loader" id="app-loader" aria-live="polite">
      <div class="app-loader__card">
        <div class="app-loader__pulse">
          <span>Loading</span>
          <span class="app-loader__dots" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </div>
        <h1 class="app-loader__title">Loading iGEM IITB Wiki</h1>
        <p class="app-loader__subtitle">Preparing the latest team story and documentation.</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
