<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iGEM IIT Bombay</title>
    <meta
      name="description"
      content="iGEM IIT Bombay — a student-led synthetic biology team representing IIT Bombay at the annual iGEM competition."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      .app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: linear-gradient(
            120deg,
            rgba(255, 255, 255, 0.85),
            rgba(240, 248, 255, 0.75)
          ),
          rgba(235, 244, 248, 0.7);
        backdrop-filter: blur(10px);
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      .app-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
      }
      .app-loader__card {
        display: grid;
        place-items: center;
        gap: 18px;
        width: min(320px, 78vw);
        padding: 28px 24px 34px;
        border-radius: 999px;
        border: 1px solid rgba(31, 122, 140, 0.18);
        background: transparent;
        box-shadow: none;
        text-align: center;
      }
      .app-loader__ring {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background:
          conic-gradient(
            from 0deg,
            rgba(31, 122, 140, 0.9),
            rgba(91, 192, 217, 0.9),
            rgba(226, 160, 83, 0.9),
            rgba(31, 122, 140, 0.9)
          );
        -webkit-mask: radial-gradient(circle, transparent 58%, #000 60%);
        mask: radial-gradient(circle, transparent 58%, #000 60%);
        animation: loader-spin 1.6s linear infinite;
        filter: drop-shadow(0 12px 20px rgba(31, 122, 140, 0.25));
      }
      .app-loader__title {
        font-family: "Cormorant Garamond", serif;
        font-size: 22px;
        margin: 0;
        color: #1f2533;
        letter-spacing: 0.06em;
      }
      @keyframes loader-spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="text-ink font-body">
    <div class="app-loader" id="app-loader" aria-live="polite">
      <div class="app-loader__card">
        <div class="app-loader__ring" aria-hidden="true"></div>
        <h1 class="app-loader__title">Loading...</h1>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
