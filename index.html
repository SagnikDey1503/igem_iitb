<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iGEM IIT Bombay</title>

    <style>
      /* ===== Glass Background (No Box) ===== */

      .app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #eef7fb, #e6f2f8);
        backdrop-filter: blur(14px);
        z-index: 9999;
        transition: opacity 0.4s ease;
        flex-direction: column;
      }

      .app-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }

      /* Spinner */
      .loader-circle {
        width: 60px;
        height: 60px;
        border: 5px solid rgba(31, 122, 140, 0.2);
        border-top: 5px solid #1f7a8c;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }

      /* Text */
      .loader-text {
        font-size: 18px;
        font-family: sans-serif;
        letter-spacing: 1px;
      }

      /* Bigger RGB Dots */
      .dots span {
        display: inline-block;
        font-size: 22px;
        font-weight: bold;
        animation: wave 1.2s infinite ease-in-out;
      }

      .dots span:nth-child(1) {
        color: #e63946; /* red */
        animation-delay: 0s;
      }

      .dots span:nth-child(2) {
        color: #f4a261; /* yellow */
        animation-delay: 0.2s;
      }

      .dots span:nth-child(3) {
        color: #2a9d8f; /* green */
        animation-delay: 0.4s;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes wave {
        0%, 60%, 100% {
          transform: translateY(0);
          opacity: 0.4;
        }
        30% {
          transform: translateY(-8px);
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <!-- Loader -->
    <div class="app-loader" id="app-loader">
      <div class="loader-circle"></div>
      <div class="loader-text">
        Loading
        <span class="dots">
          <span>.</span>
          <span>.</span>
          <span>.</span>
        </span>
      </div>
    </div>

    <!-- React Root -->
    <div id="root"></div>

    <!-- Minimum 1.5 sec loader -->
    <script>
      const MIN_TIME = 1500;
      const startTime = Date.now();

      window.addEventListener("load", () => {
        const loader = document.getElementById("app-loader");
        const elapsed = Date.now() - startTime;
        const remaining = Math.max(MIN_TIME - elapsed, 0);

        setTimeout(() => {
          loader.classList.add("hidden");
          setTimeout(() => loader.remove(), 400);
        }, remaining);
      });
    </script>

    <!-- Vite Dev -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
